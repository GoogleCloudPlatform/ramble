# This is similar to ramble-image-builder.yaml, but it only validates
# the Dockerfiles for PRs, without pushing images to the registry.

tags:
  # This is used for filtering builds related to a specific PR
  - '$TRIGGER_NAME-$_PR_NUMBER'
steps:
  # Cancel older builds
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'share/ramble/cloud-build/cancel-older-builds.sh'
    env:
      - 'PR_NUMBER=$_PR_NUMBER'
      - 'TRIGGER_NAME=$TRIGGER_NAME'
      - 'BUILD_ID=$BUILD_ID'
      - 'PROJECT_ID=$PROJECT_ID'
  - name: 'gcr.io/cloud-builders/docker'
    id: build-apt
    args:
      - 'build'
      - '-f'
      - 'share/ramble/cloud-build/Dockerfile-apt'
      - '--cache-from'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/ramble-repo/ramble-${_BASE_IMG_APT}-${_BASE_VER_APT}-spack${_SPACK_REF}-python${_PYTHON_VER}:latest'
      - '--build-arg'
      - 'SPACK_REF=${_SPACK_REF}'
      - '--build-arg'
      - 'PYTHON_VER=${_PYTHON_VER}'
      - '.'
    waitFor: ['-']
  - name: 'gcr.io/cloud-builders/docker'
    id: build-yum
    args:
      - 'build'
      - '-f'
      - 'share/ramble/cloud-build/Dockerfile-yum'
      - '--cache-from'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/ramble-repo/ramble-${_BASE_IMG_YUM}-${_BASE_VER_YUM}-spack${_SPACK_REF}-python${_PYTHON_VER}:latest'
      - '--build-arg'
      - 'SPACK_REF=${_SPACK_REF}'
      - '--build-arg'
      - 'PYTHON_VER=${_PYTHON_VER}'
      - '.'
    waitFor: ['-']

# For PR validation, only use one set of versions.
substitutions:
  _SPACK_REF: v1.1.1
  _PYTHON_VER: 3.11.14
  _BASE_IMG_APT: debian
  _BASE_VER_APT: '12.5'
  _BASE_IMG_YUM: rockylinux
  _BASE_VER_YUM: '8'

timeout: 3600s
options:
  machineType: N1_HIGHCPU_8
