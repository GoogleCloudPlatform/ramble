ramble:
  variants:
    package_manager: spack
  env_vars:
    set:
      OMP_NUM_THREADS: '{n_threads}'
  variables:
    processes_per_node: 16
    mpi_command: mpirun -n {n_ranks} -ppn {processes_per_node}
    batch_submit: '{execute_experiment}'
  applications:
    gromacs: # Application name
      workloads:
        water_gmx50: # Workload name from application
          experiments:
            pme_single_rank: # Arbitrary experiment name
              variables:
                n_ranks: 1
                n_threads: 1
                size: '0003'
                type: pme
            rf_single_rank:
              variables:
                n_ranks: 1
                n_threads: 1
                size: '0003'
                type: rf
        water_bare:
          experiments:
            pme_single_rank:
              variables:
                n_ranks: 1
                n_threads: 1
                size: '0003'
                type: pme
            rf_single_rank:
              variables:
                n_ranks: 1
                n_threads: 1
                size: '0003'
                type: rf
  software:
    packages:
      gcc9:
        pkg_spec: gcc@9.5.0 target=x86_64
        compiler_spec: gcc@9.5.0
      intel-mpi:
        pkg_spec: intel-oneapi-mpi@2021.13.1 target=x86_64
        compiler: gcc9
      gromacs:
        pkg_spec: gromacs@2024
        compiler: gcc9
    environments:
      gromacs:
        packages:
        - gromacs
        - intel-mpi
